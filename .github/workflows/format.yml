name: format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install Dependencies
        run: bun install --cwd web

      - name: Build Web
        run: bun run --cwd web build

      - name: Run Go Formatter
        run: gofmt -w .

      - name: Run Go Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

      - name: Run JavaScript Lint
        run: bun run --cwd web lint

      - name: Run JavaScript Formatter
        run: bun run --cwd web format

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: fix code style
          commit_options: "--no-verify"
